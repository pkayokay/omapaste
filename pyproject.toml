[project]
name = "omapaste"
version = "0.1.0"
description = "Clipboard history for Omarchy — a Paste-style bottom clip bar."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Paul Kim" }]
keywords = ["clipboard", "omarchy", "hyprland", "wayland"]

[project.urls]
Homepage = "https://github.com/pkayokay/omapaste"
Repository = "https://github.com/pkayokay/omapaste"

[project.scripts]
omapaste = "omapaste.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omapaste"]
