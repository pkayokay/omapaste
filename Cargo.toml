[package]
name = "omapaste"
version = "0.2.0"
edition = "2021"
description = "Clipboard history for Omarchy — a Paste-style bottom clip bar."
license = "MIT"
repository = "https://github.com/pkayokay/omapaste"
authors = ["Paul Kim"]

[dependencies]
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
env_logger = "0.11"
gdk-pixbuf = "0.22"
gdk4 = "0.11"
gio = "0.22"
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = "0.8"
hex = "0.4"
log = "0.4"
pango = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
